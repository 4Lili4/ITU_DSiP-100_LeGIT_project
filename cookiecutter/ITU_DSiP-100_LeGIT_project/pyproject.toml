[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cc_mlops_project"
version = "0.0.1"
description = "ITU MLOps project for 100% LeGIT group 2025"
authors = [
  { name = "100% LeGIT" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["cc_mlops_project"]
include = ["pyproject.toml", "cc_mlops_project/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cc_mlops_project"]
force-sort-within-sections = true

