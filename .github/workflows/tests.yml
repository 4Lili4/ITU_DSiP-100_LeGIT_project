name: Tests Pipeline

on:
  workflow_dispatch: # Manually trigger workflow, good for debugging before any push is made

jobs:
  test:
    runs-on: ubuntu-latest # Spin up VM
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Get code from GitHub into VM

      - name: Setup Go
        uses: actions/setup-go@v5 # Setup Go in VM
        with:
          go-version: '1.24' # Specify Go version for reproducibility
          cache-dependency-path: dagger/go.sum

      - name: Run Tests
        uses: dagger/dagger-for-github@v6 # Use official Dagger GitHub Action
        with:
          version: "0.19.8" # Specify Dagger version for reproducibility
          verb: call
          module: dagger
          args: test --source .
        env:
          DAGGER_LOG_FORMAT: plain # Set Dagger log format to plain text for ease of reading in GitHub