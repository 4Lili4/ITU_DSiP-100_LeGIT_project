name: Train Pipeline

on:
  push: # When push is made to main branch 
    branches: [main]
  pull_request: # When PR is made targeting main branch 
    branches: [main]
  workflow_dispatch: # Manually trigger workflow, good for debugging before any push is made

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: dagger/go.sum

      - name: Run Tests
        uses: dagger/dagger-for-github@v6 # Use official Dagger GitHub Action
        with:
          version: "0.19.8" # Specify Dagger version for reproducibility
          verb: call
          module: dagger
          args: test --source .
        env:
          DAGGER_LOG_FORMAT: plain # Set Dagger log format to plain text for ease of reading in GitHub

      - name: Run Model Training
        uses: dagger/dagger-for-github@v6 # Use official Dagger GitHub Action
        with:
          version: "0.19.8" # Specify Dagger version for reproducibility
          verb: call
          module: dagger
          args: -o ./models train --source .
        env:
          DAGGER_LOG_FORMAT: plain # Set Dagger log format to plain text for ease of reading in GitHub

      - name: Run Inference/Prediction
        uses: dagger/dagger-for-github@v6 # Use official Dagger GitHub Action
        with:
          version: "0.19.8" # Specify Dagger version for reproducibility
          verb: call
          module: dagger
          args: predict --source .
        env:
          DAGGER_LOG_FORMAT: plain # Set Dagger log format to plain text for ease of reading in GitHub

      - name: Verify Model Artifact Exists # Checks if the artifact has been saved
        run: |
          if [ ! -f "models/lead_model_lr.pkl" ]; then
            echo "ERROR: Model file not found at models/lead_model_lr.pkl"
            exit 1
          fi
          echo "DONE: Model artifact verified: models/lead_model_lr.pkl"
          ls -lh models/lead_model_lr.pkl

      - name: Rename Model for Validator # The validator expects 'model.pkl'
        run: |
          echo "Renaming model info model.pkl for compatibility with validator..."
          cp models/lead_model_lr.pkl models/model.pkl

      - name: Upload Model Artifact # Upload model artifact to GitHub using github actions
        uses: actions/upload-artifact@v4 
        with:
          name: model # Name of artifact
          path: models/model.pkl # Path to artifact to upload

      - name: Download Model Artifact
        uses: actions/download-artifact@v4 # Download model artifact from GitHub using github actions
        with:
          name: model # Name of artifact
          path: models # Path to artifact
      
      - name: List Downloaded Artifacts # For debugging, list all files in models directory 
        run: |
          echo "Listing files in workspace:"
          ls -R 

      - name: Verify Model Artifact Downloaded # For debugging, checks if the artifact has been downloaded
        run: |
          if [ ! -f "models/model.pkl" ]; then
            echo "ERROR: Model file not found after download"
            exit 1
          fi
          echo "DONE: Model artifact verified after download"

      - name: Run Model Inference Test Action # Uses model validator action provided by ITU
        uses: lasselundstenjensen/itu-sdse-project-model-validator@main